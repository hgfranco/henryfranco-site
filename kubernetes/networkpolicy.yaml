apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: henryfranco-dev-ingress
  namespace: henryfranco
spec:
  podSelector:
    matchLabels:
      app: henryfranco-dev
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 10.42.0.0/16
      ports:
        - protocol: TCP
          port: 8080
